<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#f84000"><title>صيانة المحولات - NDEDC</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#fff7f2;color:#2a1a12;font-size:18px}
header{background:#f84000;color:#fff;padding:8px 10px;display:flex;gap:6px;align-items:center;position:sticky;top:0;z-index:5}
header img{width:38px;height:38px;border-radius:50%;background:#fff}header b{flex:1;font-size:16px;line-height:1.2}header small{display:block;font-weight:normal;font-size:12px}
.hb{background:#fff3;border:1px solid #fff9;color:#fff;border-radius:8px;padding:6px 9px;font-size:15px;display:none}#sy{display:block}
main{padding:14px;max-width:660px;margin:auto}h2{margin:6px 0 14px;font-size:21px;white-space:pre-line}h3{margin:14px 0 6px}
.btn{display:block;width:100%;padding:16px;margin:0 0 10px;border:0;border-radius:12px;background:#f84000;color:#fff;font-size:19px}
.btn.alt{background:#fff;color:#c93400;border:2px solid #f84000}.btn.sm{display:inline-block;width:auto;padding:8px 16px;font-size:15px;margin:0}
.btn img{width:100%;border-radius:8px;margin-bottom:6px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .btn{margin:0;padding:12px 6px;font-size:16px}
input,select{width:100%;padding:13px;font-size:19px;border:2px solid #f0c9b8;border-radius:10px;margin-bottom:10px;background:#fff}label{display:block;margin:4px 0;font-size:16px}
.row{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;border-right:6px solid #f0c9b8}.row.ed{border-right-color:#e8a317}.row.mt{border-right-color:#e8a317;background:#fffbe6}
.row small{color:#7a5a4a;display:block}.val{font-size:19px;margin:2px 0 6px;word-break:break-word}.tag{background:#e8a317;border-radius:6px;padding:1px 8px;font-size:13px}
.err{color:#b3261e;margin:6px 0}.res{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px}.bad{background:#fde7c8}.hot{background:#f8cbad}.ok{background:#c6efce}.lo{background:#d6e8ff}
.bar{height:8px;background:#ffd9c9;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#f84000}.pc{font-size:14px;color:#7a5a4a;margin:3px 0 10px}
.vr{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;border-radius:10px;padding:8px;margin-bottom:8px;align-items:center}.vr img{width:100%;max-height:90px;object-fit:cover;border-radius:8px}.vr img.big{max-height:none;position:relative}
.vi .btn{padding:9px;font-size:15px;margin:4px 0 0}.okm{color:#1f8a4c;font-size:14px}
.dg{position:relative;margin-bottom:10px}.dg img{width:100%;border-radius:8px;display:block}.hl{position:absolute;border:3px solid #f84000;background:#f8400033;border-radius:6px;box-shadow:0 0 0 2px #fff}
.pt{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end}.pt>div{background:#fff;border-radius:16px 16px 0 0;padding:14px;width:100%;max-height:80vh;overflow:auto}
.st{padding:8px;border-bottom:1px solid #eee}.st.d{color:#1f8a4c}.st.c{color:#f84000;font-weight:bold}
iframe{width:100%;height:220px;border:0;border-radius:10px}
</style></head><body>
<header><img src="logo.png" alt=""><b>صيانة المحولات<small>شمال الدلتا لتوزيع الكهرباء NDEDC</small></b><span id="bd" style="font-size:12px"></span><button id="sy" class="hb" onclick="sync(1)">🔄</button><button id="pg" class="hb" onclick="prog()">☰</button><button id="hm" class="hb" onclick="HM&&HM()">🏠</button><button id="bk" class="hb" onclick="BK&&BK()">رجوع</button></header>
<main id="m"></main>
<script>
const API='https://script.google.com/macros/s/AKfycbx0E9Ti7p3g_ZXk-QSU7s2hPDyp3eVIdHYjl5Xtrm-uQV8MLg3pp5rD3JN9xxLuDvTq0A/exec';
const $=s=>document.querySelector(s),m=$('#m');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const dg=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.]/g,'').replace(/(\..*)\./g,'$1');
const db=new Promise(r=>{const q=indexedDB.open('tr',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result)});
const kv=(md,k,v)=>db.then(d=>new Promise(r=>{const o=d.transaction('kv',md=='get'?'readonly':'readwrite').objectStore('kv'),q=md=='get'?o.get(k):md=='del'?o.delete(k):o.put(v,k);q.onsuccess=()=>r(q.result)}));
const api=b=>fetch(API,{method:'POST',body:JSON.stringify({pin:S.pin,...b})}).then(r=>r.json());
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tr'+t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
let IMGB='';fetch('logo.png',{method:'HEAD'}).then(r=>{if(!r.ok)IMGB='img/'}).catch(()=>{});
addEventListener('error',e=>{const t=e.target;if(t&&t.tagName=='IMG'&&!t.dataset.f){t.dataset.f=1;const u=t.getAttribute('src')||'';if(!u.startsWith('data:'))t.src=u.startsWith('img/')?u.slice(4):'img/'+u}},true);
let S={pin:'',user:null,h:[],rows:[],q:[],th:[],cfgv:{},lists:{},feeders:[],thumbs:{},srt:[],done:[],ops:[],ph:[]},cur={},FL=null,PV={},H=[],BK=null,HM=null,busy=0;
const cfg=k=>{const v=parseFloat((S.cfgv||{})[k]);return isNaN(v)?0:v};
const B=(t,f,c='')=>{H.push(f);return `<button class="btn ${c}" onclick="H[${H.length-1}]()">${t}</button>`};
const col=n=>S.h.indexOf(n),row=id=>S.rows.find(r=>r[0]===id),val=(id,f)=>{const r=row(id),i=col(f);return r&&i>=0&&r[i]!=null?String(r[i]):''};
const save=()=>Promise.all([kv('put','ops',S.ops),kv('put','ph',S.ph)]).then(badge);
const badge=()=>{const n=S.ops.length+S.ph.length;$('#bd').textContent=(navigator.onLine?'':'بدون نت · ')+(n?'لسه '+n:'اتزامن ✓')};
const op=o=>{S.ops.push({uid:uid(),visit:FL&&FL.visit,id:cur.id,...o});save();sync()};
const D=()=>FL.data,fkey=()=>cur.id+'|'+cur.mode+'|'+(cur.qm||'');
function show(h,o={}){const f=o.fl&&FL,lo=f&&cur.mode=='loads',p=f?fpct():0;
 BK=o.b||(f?fback:null);HM=o.h||(f?()=>card(cur.id):null);
 m.innerHTML=(f?`<div class="bar"><i style="width:${p}%"></i></div><div class="pc">${p}% — ${p<30?'بداية موفقة':p<60?'ماشي كويس':p<90?'قربت تخلص':'خلاص تقريبًا'}</div>`:'')+h;
 $('#bk').style.display=BK?'block':'none';$('#hm').style.display=HM?'block':'none';$('#pg').style.display=f?'block':'none';scrollTo(0,0)}
const toast=t=>{const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a1a12;color:#fff;padding:10px 18px;border-radius:20px;z-index:20';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)};
async function sync(man){if(busy||!S.pin)return;if(!navigator.onLine){man&&toast('مفيش نت دلوقتي');return}busy=1;man&&toast('جاري المزامنة...');let ok=1;try{
 if(S.ops.length){const r=await api({a:'sync',ops:S.ops});if(r.ok)S.ops=S.ops.filter(o=>!r.done.includes(o.uid));else ok=0}
 for(const p of [...S.ph]){const r=await api({a:'photo',...p});if(r.ok)S.ph=S.ph.filter(x=>x.uid!==p.uid);else{ok=0;break}}}catch(e){ok=0}busy=0;await save();man&&toast(ok?'اتزامن ✓':'تعذرت المزامنة')}
setInterval(()=>sync(),30000);addEventListener('online',()=>{badge();sync()});addEventListener('offline',badge);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
// ---------- الدخول والاختيار ----------
function pin(msg){show(`<h2>اكتب الرقم السري</h2><input id="p" type="password" inputmode="numeric" maxlength="8" style="text-align:center;letter-spacing:10px;font-size:28px" oninput="this.value=dg(this.value);this.value.length==4&&login()"><div class="err">${msg||''}</div>`+B('دخول',login))}
function load(b){Object.assign(S,{h:b.h,rows:b.rows,q:(b.q||[]).filter(r=>r[1]),th:(b.th||[]).filter(r=>r[0]),cfgv:b.cfg||{},lists:b.lists||{},feeders:b.feeders||[],thumbs:b.thumbs||{},srt:b.srt||[],done:b.done||[]})}
async function login(){const p=$('#p').value.trim();if(p.length<4)return;S.pin=p;show('<h2>لحظة...</h2>');
 try{const r=await api({a:'login'});if(!r.ok)return pin('الرقم غير صحيح');S.user=r.user;await kv('put','auth',{h:await sha(p),u:r.user});const b=await api({a:'boot'});if(b.ok){load(b);await kv('put','data',b)}}
 catch(e){const a=await kv('get','auth');if(!a||a.h!==await sha(p))return pin('مفيش نت والرقم مش محفوظ على الجهاز');S.user=a.u}
 if(!S.h.length){const d=await kv('get','data');if(d)load(d)}
 if(!S.h.length)return pin('افتح التطبيق مرة بنت لتحميل البيانات');
 S.ops=(await kv('get','ops'))||[];S.ph=(await kv('get','ph'))||[];badge();sync();home()}
const persistData=()=>kv('put','data',{h:S.h,rows:S.rows,q:S.q,th:S.th,cfg:S.cfgv,lists:S.lists,feeders:S.feeders,thumbs:S.thumbs,srt:S.srt,done:S.done});
function home(){FL=null;if(S.user.role==='إدارة')return adm();show(`<h2>أهلًا ${esc(S.user.name)}</h2>`+B('📊 الأحمال والاتزان (ربع سنوي)',()=>{cur.mode='loads';qsel()})+B('🔧 صيانة المنخفض (سنوية)',()=>{cur.mode='maint';cur.qm='';types()}))}
function qsel(){show('<h2>اختار دورة الأحمال</h2>'+['يوليو','أكتوبر','يناير','أبريل'].map(x=>B(x,()=>{cur.qm=x;types()})).join(''),{b:home})}
function types(){FL=null;show('<h2>المحول عام ولا خاص؟</h2>'+B('عام',()=>feeders('عام'))+B('خاص',()=>feeders('خاص')),{b:cur.mode=='loads'?qsel:home})}
const fnames=()=>[...new Set([...S.feeders.map(f=>f[0]),...S.rows.map(r=>r[col('المغذي')])])].filter(Boolean).sort();
const srcOf=f=>(S.feeders.find(x=>x[0]==f)||[])[1]||(S.rows.find(r=>r[col('المغذي')]==f)||[])[col('مصدر التغذية')]||'';
function feeders(t){cur.t=t;const fs=[...new Set(S.rows.filter(r=>r[col('عام/خاص')]===t).map(r=>r[col('المغذي')]).concat(S.feeders.map(x=>x[0])))].filter(Boolean).sort();
 show(`<h2>اختار المغذي (${fs.length})</h2><input id="q" placeholder="ابحث" oninput="dr()">`+B('➕ إضافة مغذي جديد',addFeeder,'alt')+'<div class="grid" id="g"></div>',{b:types,h:types});
 window.dr=()=>{const q=$('#q').value.trim();$('#g').innerHTML=fs.filter(f=>f.includes(q)).map(f=>B(esc(f),()=>trs(f))).join('')};dr()}
function addFeeder(){const so=optList('مصادر التغذية');show('<h2>إضافة مغذي جديد</h2><label>اسم المغذي</label><input id="fn"><label>مصدر التغذية</label><select id="fs">'+so.map(x=>`<option>${esc(x)}</option>`).join('')+'</select><div id="er" class="err"></div>'+B('حفظ',()=>{const n=$('#fn').value.trim();if(!n)return $('#er').textContent='اكتب اسم المغذي';const s=$('#fs').value;S.feeders.push([n,s]);op({t:'addfeeder',name:n,src:s});persistData();feeders(cur.t)}),{b:()=>feeders(cur.t),h:types})}
function trs(f){cur.f=f;const ts=S.rows.filter(r=>r[col('عام/خاص')]===cur.t&&r[col('المغذي')]===f);
 show(`<h2>${esc(f)}: اختار المحول (${ts.length})</h2><input id="q" placeholder="ابحث" oninput="dr()">`+B('➕ إضافة محول جديد',newTr,'alt')+'<div id="g"></div>',{b:()=>feeders(cur.t),h:types});
 window.dr=()=>{const q=$('#q').value.trim();$('#g').innerHTML=ts.filter(r=>String(r[col('اسم المحول')]).includes(q)).map(r=>B(`<span style="display:flex;align-items:center;gap:10px">${S.thumbs[r[0]]?`<img style="width:46px;height:46px;border-radius:8px;margin:0" src="data:image/jpeg;base64,${S.thumbs[r[0]]}">`:'<span style="font-size:28px">⚡</span>'}<span style="flex:1;text-align:right">${S.done.includes(r[0])?'✓ ':''}${esc(r[col('اسم المحول')])}</span></span>`,()=>cur.adm?rep(r[0]):card(r[0]))).join('')};dr()}
function newTr(){show('<h2>إضافة محول جديد</h2><label>اسم المحول</label><input id="nn"><div id="er" class="err"></div>'+B('التالي (إدخال البيانات)',()=>{const n=$('#nn').value.trim();if(!n)return $('#er').textContent='اكتب اسم المحول';const id='TR-N'+Date.now().toString(36),r=S.h.map(()=>'');const set=(k,v)=>{const i=col(k);if(i>=0)r[i]=v};set('رقم داخلي',id);set('اسم المحول',n);set('عام/خاص',cur.t);set('المغذي',cur.f);set('مصدر التغذية',srcOf(cur.f));
 S.rows.push(r);const o={};S.h.forEach((h,i)=>o[h]=r[i]);op({t:'addtr',id,row:o});persistData();cur.fresh=1;card(id)}),{b:()=>trs(cur.f),h:types})}
// ---------- بطاقة المحول ----------
const optList=n=>{const a=(S.lists[n]||[]).map(String),c=col(n);if(c>=0)S.rows.forEach(r=>{const v=String(r[c]??'');if(v&&!a.includes(v))a.push(v)});return a};
const kr=()=>/كشك|حجرة/.test(val(cur.id,'التركيب'));
const FLD=[['قرية / كفر','list','القرى والكفور'],['مصدر التغذية','list','مصادر التغذية'],['لوحة التوزيع','list','لوحة التوزيع'],['تغذية متوسط','list','@f'],['المغذي','list','@f'],['اسم المحول','lock'],['عام/خاص','sel',['عام','خاص']],['كود المحول','text'],['كود لوحة المنخفض','text'],['كود لوحة المتوسط','text'],['نوع المحول','list','نوع المحول'],['التركيب','sel',['كشك','معلق','حجرة','قاعدة']],['وضع الـ Tap','tap'],['الجهد ك.ف','sel',['10.5','11']],['السعة ك ف أ','list','السعات ك ف أ'],['عدد السورتيهات','num'],['سنة صنع المحول','year'],['بُعد مسافة المحول عن مصدر التغذية (كم)','dist'],['سعة القاطع العمومي (أمبير)','num'],['نموذج حرارة المتوسط','model'],['نموذج حرارة المنخفض','model']];
const DIST='بُعد مسافة المحول عن مصدر التغذية (كم)';
const vDist=v=>/^\d(\.\d)?$/.test(v)&&+v<=(cfg('أقصى مسافة (كم)')||9.9)?'':'رقم من 0 إلى 9.9 وخانة عشرية واحدة فقط (مثال 7.5)';
const calc=(R,S2,T,cap)=>{const a=(R+S2+T)/3,N=Math.max(R,S2,T)-a,L=cap?Math.round(a/(cap*1.44)*100):null,dev=a?Math.max(Math.abs(R-a),Math.abs(S2-a),Math.abs(T-a))/a:0;
 const adv=[['R',R],['S',S2],['T',T]].map(([n,x])=>a&&(x-a)/a>.05?'خفّف '+n+' حوالي '+Math.round(x-a)+' أمبير':a&&(a-x)/a>.05?'زوّد '+n+' حوالي '+Math.round(a-x)+' أمبير':null).filter(Boolean);return{a,N,L,bal:dev<=.05,adv}};
const lvl=L=>L==null?'':L>(cfg('حد التحميل الأعلى %')||80)?'<span class="tag" style="background:#f8cbad">فوق '+(cfg('حد التحميل الأعلى %')||80)+'%</span>':L<(cfg('حد التحميل الأدنى %')||30)?'<span class="tag" style="background:#d6e8ff">أقل من '+(cfg('حد التحميل الأدنى %')||30)+'%</span>':'';
async function flowLoad(){const sv=await kv('get','fl:'+fkey());FL={key:fkey(),done:sv?sv.done:{},data:sv?sv.data:{},cur:sv?sv.cur:null,visit:sv?sv.visit:'V'+Date.now(),fresh:!sv}}
async function card(id){cur.id=id;await flowLoad();const nm=val(id,'اسم المحول'),mode=cur.mode,L=stepsList();let pr='';
 if(!FL.fresh){const p=fpct(),c=L.find(x=>x.id==FL.cur)||L.find(x=>!FL.done[x.id]);pr=`<div class="res"><b>آخر مرة: ${p}% ${p<30?'🌱':p<60?'👍':'🔥'}</b><div class="bar"><i style="width:${p}%"></i></div>${c?'وقفت عند: '+esc(c.t):'خلصت كل الخطوات'}</div>`+B('▶ كمّل من حيث وقفت',()=>fgo(c&&c.id))+B('عرض كل الخطوات',()=>{HM=null;prog()},'alt')+B('↺ ابدأ من الأول',()=>{FL.done={};FL.data={};FL.visit='V'+Date.now();fsave();fgo()},'alt')}
 else pr=B(mode=='loads'?'▶ ابدأ الأحمال والاتزان ('+cur.qm+')':'▶ ابدأ الصيانة',()=>fgo());
 const fs=FLD.map(([f,t,o])=>{const v=val(id,f),ch=cur.chg&&f in cur.chg;return `<div class="row ${ch?'ed':''} ${v===''&&t!='lock'?'mt':''}"><small>${esc(f)}</small><div class="val">${v===''?'ناقص':esc(v)}${ch?` <span class="tag">عُدّل (كان: ${esc(cur.chg[f]||'فارغ')})</span>`:''}</div>${t=='lock'?'':B('تعديل',()=>edit(f),'sm alt')}</div>`}).join('');
 const R=+val(id,'حمل العمومي R'),S2=+val(id,'حمل العمومي S'),T=+val(id,'حمل العمومي T'),Ld=val(id,'نسبة التحميل %'),ca=(R||S2||T)?calc(R,S2,T,+val(id,'السعة ك ف أ')):null;
 const ld=`<div class="res"><small>الأحمال (من آخر دورة)</small>حمل العمومي: R ${val(id,'حمل العمومي R')||'—'} · S ${val(id,'حمل العمومي S')||'—'} · T ${val(id,'حمل العمومي T')||'—'}<br>نسبة التحميل: ${ca&&ca.L!=null?ca.L+'%':Ld||'—'} ${lvl(ca?ca.L:+Ld||null)}<br>الاتزان: ${ca?(ca.bal?'متزن':'غير متزن'):'—'}<br>جهد المحول الثانوي: ${esc(val(id,'الجهد ك.ف')||'—')}</div>`;
 const X=val(id,'X'),Y=val(id,'Y'),mp=X&&Y?(navigator.onLine?`<iframe loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${+X-.004},${+Y-.003},${+X+.004},${+Y+.003}&layer=mapnik&marker=${Y},${X}"></iframe>`:`<div class="res">الموقع: ${Y}, ${X} (الخريطة محتاجة نت)</div>`):'<div class="res">الموقع لسه ما اتسجلش</div>';
 show(`<h2>${esc(nm)}</h2><div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">${S.thumbs[id]?`<img style="width:80px;height:80px;border-radius:10px" src="data:image/jpeg;base64,${S.thumbs[id]}">`:'<div style="font-size:50px">⚡</div>'}${B('📷 صورة المحول',()=>grab('صورة_المحول',b=>{thumb(b);card(id)}),'sm alt')}</div>`+pr+'<h3>بيانات المحول</h3>'+fs+ld+mp,{b:()=>trs(cur.f),h:types})}
function thumb(b){const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),k=Math.max(96/i.width,96/i.height);x.drawImage(i,(96-i.width*k)/2,(96-i.height*k)/2,i.width*k,i.height*k);const t=c.toDataURL('image/jpeg',.6).split(',')[1];S.thumbs[cur.id]=t;op({t:'thumb',id:cur.id,b64:t});S.ph.push({uid:uid(),id:cur.id,visit:'',kind:'صورة_المحول',b64:b});persistData();save();card(cur.id)};i.src='data:image/jpeg;base64,'+b}
